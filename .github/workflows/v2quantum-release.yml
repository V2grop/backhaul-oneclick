name: V2Quantum release

on:
  push:
    tags:
      - "v2quantum-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2quantum-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: v2quantum-go/go.mod

      - name: Verify
        run: make check

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v2quantum-v}"
          make release VERSION="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/v2quantum-linux-amd64 \
            dist/v2quantum-linux-arm64 \
            dist/v2quantum-manager \
            dist/v2quantum-installer \
            dist/v2quantum-watchdog \
            dist/v2quantum@.service \
            dist/v2quantum-watchdog@.service \
            dist/v2quantum-watchdog@.timer \
            dist/SHA256SUMS \
            --title "V2Quantum ${GITHUB_REF_NAME#v2quantum-v}" \
            --generate-notes
